service: checkbox-detection-service
frameworkVersion: '3'

custom:
  # one definition for the detector's function name: it names the env var the api
  # reads and scopes the api role's lambda:InvokeFunction grant, and the two must match
  detectorFunctionName: ${self:service}-${sls:stage}-detector

plugins:
  - serverless-better-credentials
  - serverless-offline

package:
  individually: true

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  profile: ${env:AWS_PROFILE, 'personal'} # local AWS CLI/SSO profile; override with AWS_PROFILE
  architecture: arm64
  timeout: 29
  versionFunctions: false
  logRetentionInDays: 14
  runtimeManagement: onFunctionUpdate
  # wildcard is fine here since /detect has no auth/cookies to protect, and the
  # frontend calls this from a different origin (the CloudFront distribution).
  # I'd scope this down to that exact origin, but the distribution domain isn't
  # known until the first deploy and /detect is public anyway.
  httpApi:
    cors: true
  ecr:
    images:
      detector:
        path: services/detector
  iam:
    role:
      statements:
        - Effect: Allow
          Action: lambda:InvokeFunction
          # built as a string, not !GetAtt, so this role doesn't depend on the
          # detector function that itself depends on this same shared role
          Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:custom.detectorFunctionName}'
        - Effect: Allow
          Action: textract:AnalyzeDocument
          # used only by the opt-in strategy=textract path; Textract's sync API
          # can't be scoped to a resource, so * is what the AWS docs tell you to use
          Resource: '*'

functions:
  api:
    handler: apps/api/dist/lambda.handler
    package:
      patterns:
        - '!**'
        - 'apps/api/dist/**'
    environment:
      DETECTOR_FUNCTION_NAME: ${self:custom.detectorFunctionName}
      # flip to 'false' on the deployed Lambda (console) for an instant Textract
      # cost stop; a redeploy resets it to this value
      TEXTRACT_ENABLED: ${env:TEXTRACT_ENABLED, 'true'}
    events:
      - httpApi:
          path: /detect
          method: post
          # /detect stays public/unauthenticated per the brief; the throttle below
          # (on the stage, since httpApi has no per-route config key) is a coarse
          # abuse cap, not a real quota.

  detector:
    image:
      name: detector

resources:
  # coarse abuse cap on the one public route; httpApi has no per-route throttle
  # config key, so this patches the auto-created stage
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
  Resources:
    # Private bucket - only the CloudFront distribution can read it, through the
    # Origin Access Control below.
    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        # explicit name so the bucket is predictable, not a random suffix
        BucketName: ${self:service}
        # block all public access; CloudFront reaches it through OAC, which is a
        # service principal, not "public", so this does not get in the way
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub '${WebBucket.Arn}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'
    # OAC lets the distribution sign its S3 origin requests with SigV4, so the
    # bucket can stay fully private.
    WebOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-web
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4
    WebDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          # NA + EU edge locations only; the cheapest tier and enough for a demo
          PriceClass: PriceClass_100
          HttpVersion: http2and3
          Origins:
            - Id: web-bucket
              DomainName: !GetAtt WebBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
          DefaultCacheBehavior:
            TargetOriginId: web-bucket
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            # AWS managed "CachingOptimized" policy
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # single-page app: a private-bucket 403 or a missing key both serve index.html
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
          # the free *.cloudfront.net certificate; a custom domain would swap this
          # for an ACM cert in us-east-1 plus an Aliases entry
          ViewerCertificate:
            CloudFrontDefaultCertificate: true
  Outputs:
    WebBucketName:
      Value: !Ref WebBucket
    WebDistributionId:
      Value: !Ref WebDistribution
    WebsiteURL:
      Value: !Sub 'https://${WebDistribution.DomainName}'
