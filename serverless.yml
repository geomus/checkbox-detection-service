service: checkbox-detection-service
frameworkVersion: '3'

custom:
  # one definition for the detector's function name: it names the env var the api
  # reads and scopes the api role's lambda:InvokeFunction grant, and the two must match
  detectorFunctionName: ${self:service}-${sls:stage}-detector

plugins:
  - serverless-better-credentials
  - serverless-offline

package:
  individually: true

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  profile: ${env:AWS_PROFILE, 'personal'} # local AWS CLI/SSO profile; override with AWS_PROFILE
  architecture: arm64
  timeout: 29
  versionFunctions: false
  logRetentionInDays: 14
  runtimeManagement: onFunctionUpdate
  # wildcard is fine here since /detect has no auth/cookies to protect, and the
  # frontend will call this from a different origin (the S3 website endpoint).
  # I'd scope this down to that exact origin once there's a stable domain in front
  # of it (CloudFront), but not worth pinning to a bucket URL that might still move.
  httpApi:
    cors: true
  ecr:
    images:
      detector:
        path: services/detector
  iam:
    role:
      statements:
        - Effect: Allow
          Action: lambda:InvokeFunction
          # built as a string, not !GetAtt, so this role doesn't depend on the
          # detector function that itself depends on this same shared role
          Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:custom.detectorFunctionName}'
        - Effect: Allow
          Action: textract:AnalyzeDocument
          # used only by the opt-in strategy=textract path; Textract's sync API
          # can't be scoped to a resource, so * is what the AWS docs tell you to use
          Resource: '*'

functions:
  api:
    handler: apps/api/dist/lambda.handler
    package:
      patterns:
        - '!**'
        - 'apps/api/dist/**'
    environment:
      DETECTOR_FUNCTION_NAME: ${self:custom.detectorFunctionName}
      # flip to 'false' on the deployed Lambda (console) for an instant Textract
      # cost stop; a redeploy resets it to this value
      TEXTRACT_ENABLED: ${env:TEXTRACT_ENABLED, 'true'}
    events:
      - httpApi:
          path: /detect
          method: post
          # /detect stays public/unauthenticated per the brief; the throttle below
          # (on the stage, since httpApi has no per-route config key) is a coarse
          # abuse cap, not a real quota.

  detector:
    image:
      name: detector

resources:
  # coarse abuse cap on the one public route; httpApi has no per-route throttle
  # config key, so this patches the auto-created stage
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
  Resources:
    # TODO: CloudFront in front of this for HTTPS and a custom domain - the plain
    # S3 website endpoint is HTTP only. Deliberately deferred.
    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        # explicit name so the website endpoint reads as
        # <service>.s3-website-<region>.amazonaws.com, not a random suffix
        BucketName: ${self:service}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        # a static-site bucket is meant to be world-readable; the policy below
        # grants only s3:GetObject
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${WebBucket.Arn}/*'
  Outputs:
    WebBucketName:
      Value: !Ref WebBucket
    WebsiteURL:
      Value: !GetAtt WebBucket.WebsiteURL
