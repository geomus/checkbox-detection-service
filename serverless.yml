service: checkbox-detection-service
frameworkVersion: '3'

custom:
  # one definition for the detector's function name: it names the env var the api
  # reads and scopes the api role's lambda:InvokeFunction grant, and the two must match
  detectorFunctionName: ${self:service}-${sls:stage}-detector

plugins:
  - serverless-better-credentials
  - serverless-offline

package:
  individually: true

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  profile: personal # local AWS CLI profile name, not a secret; override with --aws-profile to deploy under a different one
  architecture: arm64
  timeout: 29
  versionFunctions: false # no aliases/traffic-shifting here, skip the extra Version resources
  logRetentionInDays: 14
  runtimeManagement: onFunctionUpdate
  # wildcard is fine here since /detect has no auth/cookies to protect, and the
  # frontend will call this from a different origin (the S3 website endpoint).
  # I'd scope this down to that exact origin once there's a stable domain in front
  # of it (CloudFront), but not worth pinning to a bucket URL that might still move.
  httpApi:
    cors: true
  ecr:
    images:
      detector:
        path: services/detector
  iam:
    role:
      statements:
        - Effect: Allow
          Action: lambda:InvokeFunction
          # built as a string, not !GetAtt, so this role doesn't depend on the
          # detector function that itself depends on this same shared role
          Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:custom.detectorFunctionName}'
        - Effect: Allow
          Action: textract:AnalyzeDocument
          # used only by the opt-in strategy=textract path; Textract's sync API
          # can't be scoped to a resource, so * is what the AWS docs tell you to use
          Resource: '*'

functions:
  api:
    handler: apps/api/dist/lambda.handler
    package:
      patterns:
        - '!**'
        - 'apps/api/dist/**'
    environment:
      DETECTOR_FUNCTION_NAME: ${self:custom.detectorFunctionName}
      # flip to 'false' on the deployed Lambda (console) for an instant Textract
      # cost stop; a redeploy resets it to this value
      TEXTRACT_ENABLED: ${env:TEXTRACT_ENABLED, 'true'}
    events:
      - httpApi:
          path: /detect
          method: post
          # no throttle on this route yet. It has to stay public/unauthenticated per
          # the brief, so right now the only thing capping cost is API Gateway's
          # account-wide default. I could add a per-route limit with a raw
          # CloudFormation RouteSettings override (httpApi doesn't expose it as a
          # plain config key), but I'd rather pick a real number once I've seen
          # actual traffic than guess.

  detector:
    image:
      name: detector
